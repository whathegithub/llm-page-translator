<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LLM Page Translator</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>LLM 网页翻译</h1>
          <p>原位替换网页文本</p>
        </div>
        <span id="statusBadge" data-tone="idle">待命</span>
      </header>

      <section class="card manual-card">
        <div class="manual-heading">
          <div>
            <h2>主动翻译</h2>
            <p>粘贴单词或短文本</p>
          </div>
          <span id="manualWordCount" data-tone="normal">0 / 50 单词</span>
        </div>

        <textarea id="manualInput" rows="3" spellcheck="false" aria-label="主动翻译输入" placeholder="最多输入 50 个单词"></textarea>
        <button id="manualTranslateButton" class="primary manual-translate-button" type="button" disabled>翻译输入内容</button>
        <p id="manualMessage" class="manual-message" role="status"></p>

        <div id="manualResult" class="manual-result" hidden>
          <div class="manual-result-row">
            <span>翻译</span>
            <p id="manualTranslation"></p>
          </div>
          <div id="manualPronunciationRow" class="manual-result-row" hidden>
            <span>中文模拟发音</span>
            <p id="manualPronunciation"></p>
          </div>
        </div>
      </section>

      <section class="card">
        <details id="modelSettings" class="model-settings">
          <summary>
            <span>模型配置</span>
            <span id="modelSummary" class="model-summary">OpenAI Compatible</span>
          </summary>
          <div class="model-settings-content">
            <label>
              <span>接口协议</span>
              <select id="protocol">
                <option value="openai">OpenAI Compatible</option>
                <option value="deepseek">DeepSeek</option>
                <option value="anthropic">Anthropic Messages</option>
                <option value="gemini">Google Gemini</option>
              </select>
            </label>

            <label>
              <span>API 地址</span>
              <input id="endpoint" type="url" spellcheck="false" placeholder="https://api.example.com/v1/chat/completions">
            </label>

            <label>
              <span>模型</span>
              <input id="model" type="text" spellcheck="false" placeholder="模型名称">
            </label>

            <label>
              <span>API Key</span>
              <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="仅保存在本机 Chrome 中">
            </label>
          </div>
        </details>

        <div class="language-grid">
          <label>
            <span>源语言</span>
            <select id="sourceLanguage">
              <option value="auto">自动检测</option>
              <option value="zh-CN">简体中文</option>
              <option value="zh-TW">繁体中文</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="ko">한국어</option>
              <option value="fr">Français</option>
              <option value="de">Deutsch</option>
              <option value="es">Español</option>
            </select>
          </label>
          <label>
            <span>目标语言</span>
            <select id="targetLanguage">
              <option value="zh-CN">简体中文</option>
              <option value="zh-TW">繁体中文</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="ko">한국어</option>
              <option value="fr">Français</option>
              <option value="de">Deutsch</option>
              <option value="es">Español</option>
            </select>
          </label>
        </div>

        <details class="performance-settings">
          <summary>性能设置</summary>
          <div class="advanced-grid">
            <label>
              <span>并发请求</span>
              <input id="concurrency" type="number" min="1" max="4" step="1">
            </label>
            <label>
              <span>每批字符</span>
              <input id="batchChars" type="number" min="500" max="8000" step="100">
            </label>
            <label>
              <span>每批片段</span>
              <input id="batchItems" type="number" min="5" max="50" step="1">
            </label>
          </div>
        </details>

        <div class="connection-test">
          <button id="testButton" type="button">测试连接</button>
          <span>会发送一条极小的真实请求</span>
        </div>

        <p id="message" role="status"></p>
      </section>

      <div class="actions">
        <button id="translateButton" class="primary" type="button">翻译当前页面</button>
        <button id="stopButton" type="button">停止</button>
        <button id="restoreButton" type="button">恢复原文</button>
      </div>

      <p id="progress">尚未开始</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
