<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Screenshot 2</title>
    <link rel="stylesheet" href="../../src/popup/popup.css">
    <style>
      html, body { width: 100% !important; height: 100%; margin: 0; overflow: hidden; background: #0f172a; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; position: relative; }
      .stage {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.35), transparent 32%),
          radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.24), transparent 28%),
          #0f172a;
      }
      .frame {
        width: 422px;
        border-radius: 18px;
        background: #f5f7fb;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }
      .caption {
        position: absolute;
        left: 72px;
        top: 250px;
        width: 360px;
        color: white;
      }
      .caption h2 { margin: 0 0 10px; font-size: 34px; }
      .caption p { margin: 0; color: #cbd5e1; font-size: 18px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="caption">
      <h2>主动翻译单词</h2>
      <p>输入一个英文单词，即可得到中文释义和中文模拟发音，适合快速查词。</p>
    </div>
    <div class="stage">
      <div class="frame">
        <main>
          <header>
            <div>
              <h1>LLM 网页翻译</h1>
              <p>原位替换网页文本</p>
            </div>
            <span id="statusBadge" data-tone="success">已完成</span>
          </header>
          <section class="card manual-card">
            <div class="manual-heading">
              <div>
                <h2>主动翻译</h2>
                <p>粘贴单词或短文本</p>
              </div>
              <span id="manualWordCount">1 / 50 单词</span>
            </div>
            <textarea rows="3">hello</textarea>
            <button class="primary manual-translate-button" type="button">翻译输入内容</button>
            <p class="manual-message success">翻译完成</p>
            <div class="manual-result">
              <div class="manual-result-row">
                <span>翻译</span>
                <p>你好</p>
              </div>
              <div class="manual-result-row">
                <span>中文模拟发音</span>
                <p>哈喽</p>
              </div>
            </div>
          </section>
          <section class="card">
            <details class="model-settings">
              <summary>
                <span>模型配置</span>
                <span class="model-summary">OpenAI Compatible · gpt-5.6-luna</span>
              </summary>
            </details>
            <div class="language-grid">
              <label>
                <span>源语言</span>
                <select><option>自动检测</option></select>
              </label>
              <label>
                <span>目标语言</span>
                <select><option>简体中文</option></select>
              </label>
            </div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
