<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Screenshot 3</title>
    <link rel="stylesheet" href="../../src/popup/popup.css">
    <style>
      html, body { width: 100% !important; height: 100%; margin: 0; overflow: hidden; background: #e8edf5; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .layout {
        display: grid;
        grid-template-columns: 1fr 430px;
        width: 100%;
        height: 100%;
      }
      .copy {
        padding: 120px 64px;
      }
      .copy h2 { margin: 0 0 12px; font-size: 36px; }
      .copy p { margin: 0 0 18px; color: #475467; font-size: 18px; line-height: 1.7; }
      .copy ul { margin: 0; padding-left: 18px; color: #344054; font-size: 16px; line-height: 1.8; }
      .frame {
        margin: 24px 28px 24px 0;
        border-radius: 18px;
        background: #f5f7fb;
        box-shadow: 0 18px 48px rgba(15, 23, 42, 0.12);
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <section class="copy">
        <h2>使用你自己的模型</h2>
        <p>配置一次即可开始翻译。API Key 只保存在本机 Chrome 中，扩展不会把它发到开发者服务器。</p>
        <ul>
          <li>OpenAI Compatible / DeepSeek / Anthropic / Gemini</li>
          <li>保存配置时才申请对应 API 域名权限</li>
          <li>可用极小真实请求测试连接</li>
        </ul>
      </section>
      <div class="frame">
        <main>
          <header>
            <div>
              <h1>LLM 网页翻译</h1>
              <p>原位替换网页文本</p>
            </div>
            <span id="statusBadge" data-tone="idle">待命</span>
          </header>
          <section class="card">
            <details class="model-settings" open>
              <summary>
                <span>模型配置</span>
                <span class="model-summary">DeepSeek · deepseek-v4-flash</span>
              </summary>
              <div class="model-settings-content">
                <label>
                  <span>接口协议</span>
                  <select><option>DeepSeek</option></select>
                </label>
                <label>
                  <span>API 地址</span>
                  <input value="https://api.deepseek.com/chat/completions" readonly>
                </label>
                <label>
                  <span>模型</span>
                  <input value="deepseek-v4-flash" readonly>
                </label>
                <label>
                  <span>API Key</span>
                  <input type="password" value="sk-local-only" readonly>
                </label>
              </div>
            </details>
            <div class="connection-test">
              <button type="button">测试连接</button>
              <span>会发送一条极小的真实请求</span>
            </div>
            <p id="message" class="success">连接成功，耗时 412 ms，返回：连接测试</p>
          </section>
          <div class="actions">
            <button class="primary" type="button">翻译当前页面</button>
            <button type="button">停止</button>
            <button type="button">恢复原文</button>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
